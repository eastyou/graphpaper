[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graphpaper"
version = "0.1.0"
description = "方格纸 / 点阵纸 / 坐标纸生成器：一条命令输出可打印的 A4 纸"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "teacher", "graph-paper", "coordinate", "print", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
graphpaper = "graphpaper.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/graphpaper"
Source = "https://github.com/eastyou/graphpaper"

[tool.setuptools]
packages = ["graphpaper"]
